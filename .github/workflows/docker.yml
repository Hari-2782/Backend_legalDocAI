name: Deploy LegalDoc AI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Any env you want to pass to Docker, or use Railway secrets
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_MODEL: ${{ secrets.HF_MODEL }}
      CHROMA_CLOUD_API_KEY: ${{ secrets.CHROMA_CLOUD_API_KEY }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare Firebase credentials
      run: |
        mkdir -p ./app
        echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > ./app/firebase-config.json
      shell: bash

    - name: Build Docker image
      run: |
        docker build -t legaldoc-ai:latest .

    - name: Log in to Railway
      uses: railwayapp/railway-action@v2
      with:
        apiKey: ${{ secrets.RAILWAY_API_KEY }}

    - name: Deploy to Railway
      run: |
        railway up --detach
