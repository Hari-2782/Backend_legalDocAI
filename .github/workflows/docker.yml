name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1️⃣ Set up Python (optional if building Docker only)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 2️⃣ Write Firebase secret to a file
      - name: Write Firebase credentials
        run: |
          mkdir -p /app
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > /app/firebase-config.json

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t legaldoc-ai:latest .

      # 4️⃣ Log in to Railway Docker registry
      - name: Login to Railway Docker
        run: |
          echo "${{ secrets.RAILWAY_TOKEN }}" | docker login registry.railway.app -u _ --password-stdin

      # 5️⃣ Push Docker image to Railway
      - name: Push Docker image
        run: |
          docker tag legaldoc-ai:latest registry.railway.app/${{ secrets.RAILWAY_PROJECT_ID }}/legaldoc-ai:latest
          docker push registry.railway.app/${{ secrets.RAILWAY_PROJECT_ID }}/legaldoc-ai:latest

      # 6️⃣ Optional: Trigger Railway deployment API
      - name: Trigger Railway Deployment
        run: |
          curl -X POST "https://backboard.railway.app/api/v1/projects/${{ secrets.RAILWAY_PROJECT_ID }}/deployments" \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}"
